// cek format & ukuran; gambar dikonversi/dikompres bila format hasil JPG
async function pgPrep() {
  PG.err = ""; PG.blob = null;
  const f = PG.file; if (!f) return pgRender();
  const t = EXT[f.type] || (f.name.split(".").pop() || "").toUpperCase();
  const isImg = /^image\//.test(f.type);
  if (isImg && PG.fmt === "JPG") {
    if (t !== "JPG" || f.size / 1024 > PG.kb) {
      try { PG.blob = await toJpg(f, PG.kb); } catch (e) { PG.err = "Gambar tidak bisa dibaca"; }
    }
  } else if (t !== PG.fmt && !(isImg && PG.fmt === "PNG" && t === "PNG")) PG.err = `Harus ${PG.fmt}`;
  pgRender();
}
async function toJpg(file, maxKb) {
  const img = await createImageBitmap(file);
  let w = img.width, hh = img.height; const lim = 2400; if (Math.max(w, hh) > lim) { const r = lim / Math.max(w, hh); w = Math.round(w * r); hh = Math.round(hh * r); }
  for (let pass = 0; pass < 5; pass++) {
    const c = document.createElement("canvas"); c.width = w; c.height = hh; const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, w, hh); g.drawImage(img, 0, 0, w, hh);
    const enc = (q) => new Promise((r) => c.toBlob(r, "image/jpeg", q));
    let lo = 0.35, hi = 0.92, best = null;
    for (let i = 0; i < 7; i++) { const q = (lo + hi) / 2; const b = await enc(q); if (b.size / 1024 <= maxKb) { best = b; lo = q; } else hi = q; }
    if (!best) { const b = await enc(0.35); if (b.size / 1024 <= maxKb) best = b; }
    if (best) return new File([best], file.name.replace(/\.[^.]+$/, "") + ".jpg", { type: "image/jpeg" });
    w = Math.round(w * 0.75); hh = Math.round(hh * 0.75);
  }
  throw new Error("terlalu besar");
}

   <label class="f">Hadiah (opsional)</label><input id="a_h" maxlength="160" placeholder="mis. Juara 1–3: voucher akses 1 tahun + e-sertifikat">
   <p class="small muted">Sistem memilih 30 TWK, 35 TIU, dan 45 TKP secara acak dari soal aktif. Semua peserta mendapat soal yang sama.</p><button class="btn gold" onclick="window.A.aAdd()">Jadwalkan</button></div>
  <div class="card tw" style="padding:4px"><table><tr><th>Event</th><th>Mulai</th><th>Status</th><th>Peserta</th><th></th></tr>${(ev || []).map((e) => { const [t, c] = st(e); return `<tr><td><b>${h(e.judul)}</b><div class="small muted">${h(e.hadiah || "")}</div></td><td class="small">${tgl(e.mulai, 1)} · ${e.akses_jam} jam</td><td><span class="pill ${c}">${t}</span></td><td>${n[e.id] || 0} peserta</td><td class="row" style="gap:4px"><button class="btn sm line" onclick="window.A.aScores('${e.id}')">Peringkat</button><button class="btn sm danger" onclick="window.A.aDel('${e.id}')">Hapus</button></td></tr>`; }).join("") || `<tr><td colspan="5" class="muted">Belum ada event.</td></tr>`}</table></div>`);
}
A.aAdd = async () => {
  const judul = $("#a_j").value.trim(), m = $("#a_m").value; if (!judul || !m) return flash("Judul dan waktu mulai wajib diisi.", false);
  const pick = async (k, n) => { const { data } = await sb.from("soal").select("id").eq("kategori", k).eq("hidden", false).limit(5000); const ids = (data || []).map((x) => x.id); for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; } return ids.slice(0, n); };
  const ids = [...(await pick("twk", 30)), ...(await pick("tiu", 35)), ...(await pick("tkp", 45))];
  const { error } = await sb.from("arena_events").insert({ judul, mulai: new Date(m).toISOString(), akses_jam: Math.max(1, Math.min(72, +$("#a_a").value || 3)), soal_ids: ids, hadiah: $("#a_h").value.trim() || null });
  flash(error ? error.message : "Event Arena dijadwalkan.", !error); route();
};
A.aDel = async (id) => { if (!confirm("Hapus event ini beserta semua skornya?")) return; const { error } = await sb.from("arena_events").delete().eq("id", id); flash(error ? error.message : "Event dihapus.", !error); route(); };
A.aScores = async (id) => {
  const { data } = await sb.from("arena_scores").select("*").eq("event_id", id);
  const b = (data || []).sort((a, c) => c.total - a.total || c.tkp - a.tkp || c.tiu - a.tiu || c.twk - a.twk);
  window._sc = { id, b };
  modal(`<h2>Papan peringkat</h2><div class="tw"><table><tr><th>#</th><th>Nama</th><th>TWK</th><th>TIU</th><th>TKP</th><th>Total</th><th></th></tr>${b.map((x, i) => `<tr><td>${i + 1}</td><td>${h(x.nama)}${x.lulus_pg ? "" : ' <span class="pill bad">PG</span>'}</td><td>${x.twk}</td><td>${x.tiu}</td><td>${x.tkp}</td><td><b>${x.total}</b></td><td><button class="btn sm danger" onclick="window.A.aDelScore('${x.user_id}')">Diskualifikasi</button></td></tr>`).join("") || `<tr><td colspan="7" class="muted">Belum ada peserta.</td></tr>`}</table></div><div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" onclick="window.A.closeModal()">Tutup</button></div>`);
};
A.aDelScore = async (uid) => { if (!confirm("Diskualifikasi peserta ini (skornya dihapus)?")) return; const { error } = await sb.from("arena_scores").delete().eq("event_id", window._sc.id).eq("user_id", uid); if (error) return alert(error.message); A.aScores(window._sc.id); };

boot();
</script>
</body>
</html>
