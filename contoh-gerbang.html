<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Jalan NIP Academy — uji gerbang login & pembayaran</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#f4f6fa;margin:0;padding:40px 16px;color:#17202b}main{max-width:560px;margin:auto;background:#fff;border-radius:16px;padding:24px}button{padding:10px 16px;border-radius:10px;border:0;background:#1d4e7a;color:#fff;font:inherit;font-weight:700;cursor:pointer}</style>
</head>
<body>
<main id="app" hidden>
  <h1>Akses aktif ✓</h1>
  <p id="info"></p>
  <p>Di aplikasi sungguhan, di titik inilah Jalan NIP Academy mulai berjalan (render beranda, muat progres dari akun, dan seterusnya).</p>
  <button id="keluar">Keluar</button>
</main>
<script type="module">
  import { createJNIP } from "./jnip-auth.js";

  // ======== ISI DENGAN DATA PROJECT-MU ========
  const JNIP_CONFIG = {
    supabaseUrl: "https://XXXXXXXX.supabase.co",           // Project Settings → API → Project URL
    supabaseAnonKey: "eyJ...anon-key...",                    // Project Settings → API → anon public key
    midtransClientKey: "SB-Mid-client-XXXXXXXX",            // Midtrans Dashboard → Settings → Access Keys → Client Key
    adminUrl: "admin.html",                                     // akun admin otomatis diarahkan ke konsol ini
    midtransProduction: false,                              // ubah ke true saat sudah live
  };
  // ===========================================

  const jnip = createJNIP(JNIP_CONFIG);
  const { user, profile } = await jnip.gate();
  document.getElementById("app").hidden = false;
  document.getElementById("info").textContent =
    `${user.email} · akses sampai ${profile.akses_sampai ? new Date(profile.akses_sampai).toLocaleDateString("id-ID", { day: "numeric", month: "long", year: "numeric" }) : "(admin)"}`;
  document.getElementById("keluar").onclick = () => jnip.signOut();
</script>
</body>
</html>
